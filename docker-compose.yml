services:
  ollama:
    image: ollama/ollama:latest
    container_name: translator-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flask-app:
    build: .
    container_name: translator-flask
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
    volumes:
      - .:/app
    depends_on:
      ollama:
        condition: service_healthy
    command: flask run --host=0.0.0.0

volumes:
  ollama-data:
    driver: local

